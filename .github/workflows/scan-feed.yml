name: Scan feed

# The daily DCY regulatory scan runs in a cloud sandbox whose egress proxy blocks sec.gov and UK RNS
# hosts. This job fetches those primary sources from a normal runner ahead of the scan (13:00 UTC) and
# commits them to data/scan-feed/, which the scan reads straight from the cloned repo.
# US issuers (Strategy, Strive, Bitmine, DeFi Dev) publish ~08:00-08:52 ET, before the 13:30 UTC open
# (14:30 UTC once US clocks go back on 1 Nov 2026 — their filings then land an hour later in UTC, so
# REVISIT these times then). The scan itself runs at 13:10 UTC, so the feed must land before that.
# Four schedules spread across the 13:00-13:08 UTC window: GitHub drops/delays scheduled runs often
# enough that one backup isn't enough — confirmed 2026-10-15, when BOTH the 13:00 and 13:05 triggers
# failed to fire at all (no scheduled run appears in the Actions history for that day, only the two
# manual workflow_dispatch runs from setup on 2026-10-14), leaving the feed a full day stale and
# missing same-day RNS/filings. A newly-added or just-edited schedule also only takes effect from the
# next UTC day onward, so a same-day edit won't retroactively fix that day's run.
# 2026-10-16: even the widened 4-schedule window fired zero times on time (confirmed over its first
# full day in effect) — same "GitHub cron is best-effort" problem already solved for the email sends
# in email-crons.yml. Primary trigger is now cron-job.org calling /api/cron/scan-feed, which dispatches
# this workflow via the GitHub REST API on a reliable external clock. The `schedule:` entries below are
# kept only as a free backup in case that external call itself gets missed.
on:
  schedule:
    - cron: '55 12 * * *'
    - cron: '0 13 * * *'
    - cron: '5 13 * * *'
    - cron: '8 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch primary sources
        run: node scripts/scanFeed.mjs
      - name: Commit feed
        run: |
          git config user.name "dcy-scan-feed"
          git config user.email "actions@users.noreply.github.com"
          # Raw feed files: no site deploy needed. The skip is enforced by vercel.json's ignoreCommand
          # (pushes touching only data/scan-feed/ are ignored); "[vercel skip]" alone does nothing.
          git add data/scan-feed
          if ! git diff --cached --quiet; then git commit -m "Scan feed $(date -u +%F) [skip ci] [vercel skip]"; fi
          # Share counts: a change here SHOULD redeploy the site (the pyramids read this file), so no skip tokens.
          git add data/capital-stack-counts.json
          if ! git diff --cached --quiet; then git commit -m "Capital-stack share counts $(date -u +%F)"; fi
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then echo "no change"; exit 0; fi
          git pull --rebase origin main
          git push origin HEAD:main
